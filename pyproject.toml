[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redsana-ai"
version = "0.1.0"
description = "RedSana AI: security assistant chat, network anomaly and outage detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn==1.7.2"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
# Sin el comodín amplio, el servicio HTTP (redsana_ai_service) no viaja dentro de la librería que instala el backend.
include = ["redsana_ai", "redsana_ai.*"]

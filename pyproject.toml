[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redsana-ai"
version = "0.1.0"
description = "RedSana AI: security assistant chat, network anomaly and outage detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn==1.7.2"]

[project.optional-dependencies]
# Las mismas versiones que el backend, para que los dos servicios se comporten igual en Render.
service = ["fastapi==0.141.1", "uvicorn[standard]==0.53.0", "pydantic==2.13.5", "pydantic-settings==2.15.0"]
test = ["pytest==9.1.1", "httpx2==2.13.0"]

[tool.setuptools.packages.find]
# Sin el comodín amplio, el servicio HTTP (redsana_ai_service) no viaja dentro de la librería que instala el backend.
include = ["redsana_ai", "redsana_ai.*"]
